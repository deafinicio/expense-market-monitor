name: Daily market scan
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-monitor
  cancel-in-progress: false
jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build sharing graphics
        run: python build_assets.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Collect observations
        id: scan
        continue-on-error: true
        run: python collect.py
      - name: Reconstruct 2026 estimates
        run: python backfill.py
      - name: Enrich pricing and lowest-star reviews
        run: python enrich.py
      - name: Persist public history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history.json docs/apps.json docs/history.csv docs/social-card.png docs/apple-touch-icon.png docs/favicon-32.png docs/release_dates.json docs/historical_estimate.json docs/details.json
          if ! git diff --cached --quiet; then
            git commit -m "data: daily app store observations"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Signal incomplete scans
        if: steps.scan.outcome == 'failure'
        run: |
          echo "Some store queries failed; charts only use complete scans." >&2
          exit 1
